---
services:
  thumbnail:
    image: ${THUMBNAIL_IMAGE:-seafileltd/thumbnail-server:13.0-latest}
    container_name: thumbnail
    restart: unless-stopped
    volumes:
      - ${SEAFILE_VOLUME:-/opt/seafile-server}:/shared
    environment:
      - TIME_ZONE=${TIME_ZONE:-Europe/Berlin}
      - SEAFILE_MYSQL_DB_HOST=${SEAFILE_MYSQL_DB_HOST:-mariadb}
      - SEAFILE_MYSQL_DB_PORT=${SEAFILE_MYSQL_DB_PORT:-3306}
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER:-root}
      - SEAFILE_MYSQL_DB_PASSWORD=${MARIADB_ROOT_PASSWORD:?Variable is not set or empty}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SITE_ROOT=${SITE_ROOT:-/}
      - INNER_SEAHUB_SERVICE_URL=${INNER_SEAHUB_SERVICE_URL:-http://seafile}
      - SEAF_SERVER_STORAGE_TYPE=${SEAF_SERVER_STORAGE_TYPE:-disk}
      #- S3_COMMIT_BUCKET=${S3_COMMIT_BUCKET:-}
      #- S3_FS_BUCKET=${S3_FS_BUCKET:-}
      #- S3_BLOCK_BUCKET=${S3_BLOCK_BUCKET:-}
      #- S3_KEY_ID=${S3_KEY_ID:-}
      #- S3_SECRET_KEY=${S3_SECRET_KEY:-}
      #- S3_USE_V4_SIGNATURE=${S3_USE_V4_SIGNATURE:-true}
      #- S3_AWS_REGION=${S3_AWS_REGION:-us-east-1}
      #- S3_HOST=${S3_HOST:-}
      #- S3_USE_HTTPS=${S3_USE_HTTPS:-true}
      #- S3_PATH_STYLE_REQUEST=${S3_PATH_STYLE_REQUEST:-false}
      #- S3_SSE_C_KEY=${S3_SSE_C_KEY:-}
    labels:
      caddy: ${SEAFILE_SERVER_HOSTNAME}
      caddy.1_handle: "/thumbnail/*"
      caddy.1_handle.0_reverse_proxy: "{{upstreams 80}}"
      caddy.2_handle_path: "/thumbnail/ping"
      caddy.2_handle_path.0_rewrite: "/ping"
      caddy.2_handle_path.1_reverse_proxy: "{{upstreams 80}}"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/ping/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend-net
      - seafile-net

networks:
  seafile-net:
    name: seafile-net
