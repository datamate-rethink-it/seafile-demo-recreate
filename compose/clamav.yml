---
services:
  av:
    image: ${CLAMAV_IMAGE:-clamav/clamav:latest}
    container_name: seafile-clamav
    restart: unless-stopped
    networks:
      - seafile-net
    depends_on:
      seafile:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  seafile-net:
    name: seafile-net
